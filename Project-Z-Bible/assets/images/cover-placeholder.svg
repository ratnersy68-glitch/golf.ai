<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#6C4F9C" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1F24"/>
      <stop offset="100%" stop-color="#2B2D33"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgFade)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- blueprint corner ticks -->
  <g stroke="#B9A6E0" stroke-width="2" opacity="0.8">
    <path d="M40,40 L90,40 M40,40 L40,90" fill="none"/>
    <path d="M1160,40 L1110,40 M1160,40 L1160,90" fill="none"/>
    <path d="M40,635 L90,635 M40,635 L40,585" fill="none"/>
    <path d="M1160,635 L1110,635 M1160,635 L1160,585" fill="none"/>
  </g>

  <!-- stylized 350Z side-profile blueprint silhouette -->
  <g transform="translate(150,330)" fill="none" stroke="#B9A6E0" stroke-width="3" opacity="0.9">
    <path d="M0,90
             C40,90 60,40 130,25
             C220,5 340,0 430,10
             C520,18 620,35 700,55
             C760,68 830,72 900,80
             L900,110
             C900,120 892,128 882,128
             L820,128
             C820,95 792,70 760,70
             C728,70 700,95 700,128
             L340,128
             C340,95 312,70 280,70
             C248,70 220,95 220,128
             L60,128
             C40,128 20,118 8,105
             Z"/>
    <circle cx="280" cy="128" r="42" stroke-width="4"/>
    <circle cx="280" cy="128" r="16"/>
    <circle cx="760" cy="128" r="42" stroke-width="4"/>
    <circle cx="760" cy="128" r="16"/>
    <line x1="150" y1="30" x2="150" y2="128" stroke-dasharray="4 4" opacity="0.5"/>
    <line x1="650" y1="20" x2="650" y2="128" stroke-dasharray="4 4" opacity="0.5"/>
  </g>

  <!-- dimension callouts -->
  <g font-family="monospace" font-size="14" fill="#B9A6E0" opacity="0.8">
    <text x="150" y="500">VQ35DE · REV-UP · 300HP BASE</text>
    <text x="150" y="522">5-SPEED AUTOMATIC · RE5R05A</text>
    <text x="150" y="544">TARGET: 500 WHP RELIABLE</text>
  </g>

  <!-- title block -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="600" y="220" text-anchor="middle" font-size="64" font-weight="700" fill="#EDEAF5" letter-spacing="6">PROJECT-Z</text>
    <text x="600" y="260" text-anchor="middle" font-size="22" fill="#B9A6E0" letter-spacing="4">B I B L E</text>
  </g>

  <rect x="60" y="600" width="1080" height="1" fill="#6C4F9C" opacity="0.6"/>
  <text x="600" y="625" text-anchor="middle" font-family="monospace" font-size="13" fill="#8A7BA8">
    2005–2006 NISSAN 350Z · AUTOMATIC · LAVENDER &amp; CHARCOAL EDITION
  </text>
</svg>
