---
# Fallback metadata used by build/export-pdf.sh when no XeLaTeX/LuaLaTeX engine is
# available and pandoc falls back to pdflatex. pdflatex can't use fontspec
# (mainfont/sansfont/monofont), so those are omitted here — everything else matches
# templates/pandoc-metadata.yaml.
title: "Project-Z Bible"
subtitle: "The 2005–2006 Nissan 350Z Automatic — Reliable 500 HP Street Build"
author: "Project-Z Build Team"
date: \today
lang: en

toc: true
toc-depth: 2
number-sections: false

documentclass: report
papersize: letter
geometry: margin=0.9in
fontsize: 11pt
colorlinks: true
linkcolor: deeplavender
citecolor: deeplavender
urlcolor: deeplavender
toccolor: deeplavender

# Named colors (not raw hex) are required here -- xcolor/hyperref need a color name
# registered via \definecolor before colorlinks can reference it.
# \let\maketitle\relax suppresses pandoc's auto-generated LaTeX title page --
# chapters/00-cover.md is our own designed cover page, so we don't want both.
header-includes:
  - |
    \usepackage{xcolor}
    \definecolor{deeplavender}{HTML}{6C4F9C}
    \let\maketitle\relax
---
