<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Golf.ai Championship</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://ratnersy68-glitch.github.io/golf.ai/styles.css">
<style>html,body{margin:0;height:100%;background:#0b0f0d;color:#eef3ef;font-family:sans-serif}#boot{text-align:center;padding-top:30vh}#rotate,#offline{display:none}</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud"></div>
  <div id="menu"></div>

  <!-- Boot loading screen (visible before the game script runs) -->
  <div id="boot">
    <div class="boot-logo">GOLF<span>.AI</span></div>
    <div class="boot-sub">CHAMPIONSHIP GOLF</div>
    <div class="putt-anim"><i class="ball"></i><i class="cup"></i><i class="flag"></i></div>
    <div class="boot-msg" id="boot-msg">Loading course…</div>
  </div>

  <!-- Portrait-phone prompt -->
  <div id="rotate">
    <div class="phone"><i></i></div>
    <div class="rotate-title">ROTATE YOUR PHONE</div>
    <div class="rotate-sub">Turn your phone sideways to play.</div>
  </div>

  <!-- Connection banner -->
  <div id="offline"><b>CONNECTION LOST</b><span>Some online assets may be unavailable.</span></div>
  <script>
    // if the game can't be downloaded (e.g. a school network blocks the site), say so instead of loading forever
    function golfBlocked() {
      var m = document.getElementById('boot-msg');
      if (m && !window.__app) { m.className = 'boot-msg err'; m.textContent = "Can't download the game from ratnersy68-glitch.github.io. This network (often a school Chromebook filter) may block it."; }
    }
    setTimeout(function () { if (!window.__app && !document.querySelector('.boot-msg.err')) { var m = document.getElementById('boot-msg'); if (m) m.textContent = 'Still loading… (slow connection or a blocked site)'; } }, 20000);
  </script>
  <script src="https://ratnersy68-glitch.github.io/golf.ai/dist/game.js" onerror="golfBlocked()"></script>
</body>
</html>
