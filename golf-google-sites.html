<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golf.ai Championship</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f0d;
  --panel: rgba(12, 17, 15, 0.72);
  --panel-solid: #121916;
  --line: rgba(255, 255, 255, 0.09);
  --text: #eef3ef;
  --dim: #93a39a;
  --accent: #3ddc84;
  --accent2: #f2c94c;
  --bad: #ff5a4f;
  --blue: #4ab3ff;
  --cond: 'Barlow Condensed', 'Oswald', 'Arial Narrow', sans-serif;
  --sans: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { position: fixed; inset: 0; touch-action: manipulation; }
:root { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
button, .chip, .opt, .menu-item { touch-action: manipulation; }
input { -webkit-user-select: text; user-select: text; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
kbd { font-family: var(--sans); font-size: 10px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; margin: 0 1px; }
.glass { background: var(--panel); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
.dim { color: var(--dim); }
.hidden { display: none !important; }

/* ---------- buttons ---------- */
.btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; padding: 10px 18px; font-family: var(--cond); font-weight: 700; letter-spacing: 0.06em; font-size: 16px; transition: all .15s; }
.btn:hover { background: rgba(255,255,255,0.16); transform: translateY(-1px); }
.btn.primary { background: linear-gradient(180deg, #43e08c, #1fae5f); border-color: #54f09b; color: #06210f; box-shadow: 0 6px 20px rgba(61,220,132,0.3); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: rgba(255,90,79,0.15); border-color: rgba(255,90,79,0.5); color: #ffb3ad; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--dim); }
.btn.ghost:hover { color: var(--text); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.big { padding: 14px 34px; font-size: 20px; }
.btn[disabled] { opacity: 0.35; pointer-events: none; }
.btn kbd { margin-left: 6px; }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.icon-btn:hover { background: rgba(255,255,255,0.14); }
.icon-btn.big { width: 52px; height: 52px; font-size: 24px; border-radius: 14px; background: var(--panel); backdrop-filter: blur(10px); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; }
#hud.visible { opacity: 1; }
#hud.visible > * { pointer-events: auto; }
#hud .toast, #hud .banner, #hud .hole-intro { pointer-events: none !important; }
.hud-top-left { position: absolute; top: 18px; left: 18px; display: flex; align-items: stretch; gap: 14px; padding: 10px 16px 10px 10px; min-width: 320px; }
.hc-num { font-family: var(--cond); font-weight: 800; font-size: 46px; line-height: 1; background: linear-gradient(160deg, #3ddc84, #169c55); color: #06210f; border-radius: 10px; min-width: 62px; display: grid; place-items: center; padding: 4px 8px; }
.hc-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.hc-course { font-size: 10px; letter-spacing: .14em; color: var(--dim); font-weight: 600; }
.hc-title { font-family: var(--cond); font-weight: 700; font-size: 24px; letter-spacing: .04em; }
.hc-sub { font-size: 12px; color: #cfe; opacity: .85; }
.hc-score { text-align: right; display: flex; flex-direction: column; justify-content: center; border-left: 1px solid var(--line); padding-left: 14px; }
.hc-stroke { font-size: 11px; letter-spacing: .12em; color: var(--dim); font-weight: 600; }
.hc-topar { font-family: var(--cond); font-weight: 800; font-size: 32px; }
.hc-topar.under, .under { color: #ff6b6b; }
.hc-topar.over, .over { color: #8ecbff; }

.hud-top-right { position: absolute; top: 18px; right: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.wind { display: flex; align-items: center; gap: 10px; padding: 8px 14px; }
.wind-label { font-size: 10px; letter-spacing: .16em; color: var(--dim); font-weight: 700; }
.wind-dial { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.18); display: grid; place-items: center; background: radial-gradient(circle, rgba(255,255,255,0.06), transparent); }
.wind-arrow { font-size: 22px; color: var(--blue); transition: transform .3s; }
.wind.strong .wind-arrow { color: var(--accent2); }
.wind-mph { font-family: var(--cond); font-weight: 700; font-size: 24px; min-width: 70px; }
.minimap { padding: 6px; }
.minimap canvas { display: block; width: 180px; height: 288px; border-radius: 9px; cursor: crosshair; }

.hud-bottom-left { position: absolute; left: 18px; bottom: 18px; width: 250px; padding: 14px 16px; }
.info-row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.info-row span { font-size: 10px; letter-spacing: .14em; color: var(--dim); font-weight: 700; width: 86px; }
.info-row b { font-family: var(--cond); font-size: 20px; font-weight: 700; }
.info-row em { font-style: normal; color: var(--dim); font-size: 12px; margin-left: auto; }
.aimbar { position: relative; flex: 1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(255,255,255,0.08), rgba(61,220,132,0.35) 50%, rgba(255,255,255,0.08)); margin: 0 6px; align-self: center; }
.aimbar i { position: absolute; top: -3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.7); }
.aimbar em { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-style: normal; font-size: 11px; color: var(--accent2); }
.club-card { padding-right: 78px !important; margin-top: 10px; background: linear-gradient(135deg, rgba(61,220,132,0.16), rgba(61,220,132,0.02)); border: 1px solid rgba(61,220,132,0.25); border-radius: 10px; padding: 10px 12px; position: relative; }
.club-name { font-family: var(--cond); font-weight: 800; font-size: 24px; letter-spacing: .03em; line-height: 1.05; }
.club-brand { font-size: 11px; color: var(--dim); }
.club-carry { position: absolute; right: 12px; top: 10px; text-align: right; font-family: var(--cond); font-weight: 800; font-size: 30px; line-height: 1; }
.club-carry small { display: block; font-size: 10px; letter-spacing: .12em; color: var(--dim); font-weight: 600; }

.hud-bottom-center { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(760px, calc(100vw - 600px)); min-width: 520px; }
.shot-controls { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; width: 100%; }
.club-picker { display: flex; align-items: center; gap: 8px; justify-content: center; }
.club-strip { display: flex; gap: 6px; }
.club-chip { width: 54px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,0.05); border: 1px solid var(--line); font-family: var(--cond); font-size: 16px; opacity: .6; cursor: pointer; transition: all .15s; }
.club-chip.active { opacity: 1; background: linear-gradient(180deg, #43e08c, #1fae5f); color: #06210f; border-color: #54f09b; transform: scale(1.12); }
.club-chip.empty { visibility: hidden; }
.ctrl-row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.seg { display: flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 2px; border: 1px solid var(--line); }
.seg button { background: none; border: none; padding: 5px 9px; font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .05em; color: var(--dim); border-radius: 6px; }
.seg button.on { background: rgba(255,255,255,0.14); color: var(--text); }
.seg button:hover { color: var(--text); }
.spin-ball { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #cfd4d8 60%, #8e969c); position: relative; cursor: crosshair; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); }
.spin-dot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #e53935; box-shadow: 0 0 6px #e53935; transition: all .15s; }

.meter-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.meter { position: relative; width: 100%; height: 30px; border-radius: 15px; background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.35)); border: 1px solid rgba(255,255,255,0.18); overflow: visible; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
.meter::before { content: ''; position: absolute; left: 76.7%; right: 0; top: 0; bottom: 0; border-radius: 0 15px 15px 0; background: repeating-linear-gradient(45deg, rgba(255,90,79,0.25) 0 6px, rgba(255,90,79,0.1) 6px 12px); }
.meter-zone { position: absolute; top: -3px; bottom: -3px; background: rgba(61,220,132,0.45); border: 2px solid #3ddc84; border-radius: 6px; box-shadow: 0 0 14px rgba(61,220,132,0.6); }
.meter-fill { position: absolute; top: 3px; bottom: 3px; border-radius: 12px; background: linear-gradient(90deg, #2a7fff, #4ab3ff 60%, #9fe0ff); box-shadow: 0 0 16px rgba(74,179,255,0.55); }
.meter-fill.over { background: linear-gradient(90deg, #2a7fff, #ff9a3c 80%, #ff5a4f); }
.meter-marker { position: absolute; top: -8px; bottom: -8px; width: 4px; margin-left: -2px; background: #fff; border-radius: 2px; box-shadow: 0 0 10px #fff; }
.meter-target { position: absolute; top: -22px; margin-left: -6px; color: var(--accent2); font-size: 16px; text-shadow: 0 0 6px rgba(0,0,0,.7); }
.meter-target::after { content: ''; position: absolute; left: 5px; top: 20px; width: 2px; height: 32px; background: var(--accent2); opacity: .8; }
.meter-ticks { position: absolute; inset: 0; pointer-events: none; }
.meter-ticks .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.22); }
.meter-ticks .tick span { position: absolute; top: 32px; left: -12px; width: 24px; text-align: center; font-size: 10px; color: var(--dim); font-weight: 600; }
.meter.hit-good { box-shadow: 0 0 0 2px #3ddc84, 0 0 30px rgba(61,220,132,.6); }
.meter.hit-bad { box-shadow: 0 0 0 2px #ff5a4f, 0 0 30px rgba(255,90,79,.5); }
.meter-wrap.putt .meter::before { display: none; }
.swing-btn { margin-top: 10px; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.15); border-radius: 22px; padding: 8px 22px; font-family: var(--cond); letter-spacing: .12em; font-size: 14px; color: var(--dim); touch-action: none; }
.swing-btn b { color: var(--text); }
.swing-btn:active { background: rgba(61,220,132,0.3); }
.aim-pad { position: absolute; right: 18px; bottom: 130px; display: none; gap: 10px; }
@media (pointer: coarse) { .aim-pad { display: flex; } .help { display: none; } }
.help { position: absolute; right: 18px; bottom: 18px; padding: 10px 12px; font-size: 11px; color: var(--dim); line-height: 1.9; }

.pin-marker { position: absolute; left: 0; top: 0; pointer-events: none !important; display: none; margin: -30px 0 0 -18px; font-family: var(--cond); font-weight: 700; font-size: 14px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); white-space: nowrap; }
.pin-marker span { color: var(--accent2); margin-right: 4px; }
.pin-marker b { background: rgba(0,0,0,0.45); border-radius: 8px; padding: 1px 6px; }
.toast { position: absolute; top: 22%; left: 50%; transform: translate(-50%, -10px) scale(.96); text-align: center; opacity: 0; transition: all .25s; text-shadow: 0 4px 20px rgba(0,0,0,0.6); }
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.toast-main { font-family: var(--cond); font-weight: 800; font-size: 44px; letter-spacing: .06em; }
.toast-sub { font-size: 15px; color: #e8f0ea; margin-top: 2px; }
.toast.great .toast-main { color: #ffd54a; }
.toast.good .toast-main { color: #7dffb0; }
.toast.bad .toast-main { color: #ff7a70; }
.banner { position: absolute; top: 38%; left: 0; right: 0; text-align: center; opacity: 0; transform: scale(.7); transition: all .45s cubic-bezier(.2,1.6,.4,1); }
.banner.show { opacity: 1; transform: scale(1); }
.banner-main { display: inline-block; font-family: var(--cond); font-weight: 800; font-size: 96px; letter-spacing: .06em; padding: 0 40px; background: linear-gradient(90deg, transparent, rgba(0,0,0,0.55) 20%, rgba(0,0,0,0.55) 80%, transparent); text-shadow: 0 6px 30px rgba(0,0,0,.5); }
.banner-sub { font-size: 18px; margin-top: 6px; color: #e8f0ea; }
.banner.great .banner-main { color: #ffd54a; }
.banner.good .banner-main { color: #fff; }
.banner.bad .banner-main { color: #9fcfff; }
.hole-intro { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); display: flex; gap: 20px; align-items: center; opacity: 0; transition: opacity .5s; background: linear-gradient(90deg, rgba(0,0,0,0.0), rgba(0,0,0,0.6) 15%, rgba(0,0,0,0.6) 85%, rgba(0,0,0,0)); padding: 18px 90px; }
.hole-intro.show { opacity: 1; }
.hi-num { font-family: var(--cond); font-weight: 800; font-size: 110px; line-height: .9; color: var(--accent); }
.hi-title { font-family: var(--cond); font-weight: 800; font-size: 40px; }
.hi-title span { color: var(--accent2); margin-left: 10px; }
.hi-yds { font-size: 16px; color: #dfe; }
.hi-tip { font-size: 14px; color: var(--dim); max-width: 520px; margin-top: 6px; }
.hi-skip { font-size: 11px; letter-spacing: .14em; color: var(--dim); margin-top: 10px; }
.practice-panel { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); padding: 14px 18px; display: none; min-width: 460px; }
.practice-panel.show { display: block; }
.pp-title { font-size: 11px; letter-spacing: .18em; color: var(--dim); font-weight: 700; margin-bottom: 8px; }
.pp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 18px; }
.pp-grid span { display: block; font-size: 10px; color: var(--dim); letter-spacing: .1em; }
.pp-grid b { font-family: var(--cond); font-size: 24px; }
.pp-btns { margin-top: 12px; display: flex; gap: 8px; }
.loading { position: fixed; inset: 0; display: none; place-items: center; background: radial-gradient(ellipse at center, rgba(8,14,11,0.82), rgba(4,6,5,0.97)); z-index: 5; }
.loading.show { display: grid; }
.load-card { text-align: center; }
.load-course { font-size: 12px; letter-spacing: .24em; color: var(--dim); font-weight: 700; }
.load-hole { font-family: var(--cond); font-weight: 800; font-size: 90px; line-height: 1; margin-top: 8px; }
.load-meta { font-family: var(--cond); font-size: 22px; color: var(--accent); letter-spacing: .08em; }
.load-tip { max-width: 520px; margin: 16px auto 0; color: #cdd; font-size: 15px; line-height: 1.5; }
.sig-badge { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--accent2); color: var(--accent2); font-size: 11px; letter-spacing: .16em; font-weight: 700; }
.spinner { width: 36px; height: 36px; margin: 26px auto 0; border-radius: 50%; border: 3px solid rgba(255,255,255,0.12); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,0.45); z-index: 4; }
.modal.show { display: grid; }
.modal-card { background: rgba(14,20,17,0.94); border: 1px solid var(--line); border-radius: 18px; padding: 22px 26px; box-shadow: 0 30px 80px rgba(0,0,0,.6); max-width: 96vw; }
.modal-card.wide { width: 980px; }
.modal-title { font-family: var(--cond); font-weight: 800; font-size: 28px; letter-spacing: .04em; margin-bottom: 14px; }
.modal-title small { font-family: var(--sans); font-weight: 500; font-size: 13px; color: var(--dim); margin-left: 10px; letter-spacing: 0; }
.paused { font-size: 12px; letter-spacing: .3em; color: var(--accent2); }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

.scorecard { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 14px; }
.scorecard th, .scorecard td { text-align: center; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.scorecard th:first-child { text-align: left; font-size: 10px; letter-spacing: .14em; color: var(--dim); width: 70px; }
.scorecard tr.hdr th { background: rgba(61,220,132,0.12); color: var(--text); font-family: var(--cond); font-size: 16px; }
.scorecard tr.hdr th:first-child { color: var(--accent); font-size: 11px; }
.scorecard td:last-child, .scorecard th:last-child { background: rgba(255,255,255,0.05); font-weight: 700; }
.scorecard tr.score td { font-family: var(--cond); font-size: 18px; font-weight: 700; }
.scorecard td.empty { color: rgba(255,255,255,0.2); }
.sc { display: inline-grid; place-items: center; width: 28px; height: 28px; font-family: var(--cond); font-weight: 700; }
.sc.birdie { border: 2px solid #ff6b6b; border-radius: 50%; color: #ff8b8b; }
.sc.eagle { border: 2px solid #ffd54a; border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,213,74,.3); color: #ffd54a; }
.sc.bogey { border: 2px solid #8ecbff; color: #b5dcff; }
.sc.dbl { border: 2px solid #8ecbff; box-shadow: 0 0 0 3px rgba(142,203,255,.3); color: #b5dcff; }
.sc-total { display: flex; gap: 30px; justify-content: flex-end; margin-top: 6px; }
.sc-total span { display: block; font-size: 10px; letter-spacing: .14em; color: var(--dim); font-weight: 700; }
.sc-total b { font-family: var(--cond); font-size: 32px; }
.sc-legend { font-size: 11px; color: var(--dim); display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.sc-legend .sc { width: 20px; height: 20px; font-size: 12px; }

/* ---------- menus ---------- */
#menu { position: fixed; inset: 0; overflow-y: auto; display: none; z-index: 3; }
#menu.visible { display: block; }
.screen { min-height: 100%; }
.screen.main { background: linear-gradient(90deg, rgba(5,9,7,0.92) 0%, rgba(5,9,7,0.6) 38%, rgba(5,9,7,0) 70%); }
.screen.page-screen { background: rgba(6,10,8,0.84); backdrop-filter: blur(6px); }
.screen.page-screen.transparent { background: linear-gradient(90deg, rgba(6,10,8,0.92) 0%, rgba(6,10,8,0.75) 40%, rgba(6,10,8,0) 62%); backdrop-filter: none; }
.screen.setup-screen { background: rgba(6,10,8,0.86); backdrop-filter: blur(8px); }
.main-layout { padding: 6vh 6vw; max-width: 620px; display: flex; flex-direction: column; gap: 22px; }
.logo { display: flex; align-items: center; gap: 16px; }
.logo-mark { font-size: 44px; width: 70px; height: 70px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(160deg, #3ddc84, #148a4a); box-shadow: 0 10px 30px rgba(61,220,132,.35); }
.logo-title { font-family: var(--cond); font-weight: 800; font-size: 64px; line-height: .9; letter-spacing: .02em; }
.logo-title span { color: var(--accent); }
.logo-sub { font-size: 12px; letter-spacing: .42em; color: var(--dim); font-weight: 600; margin-top: 4px; }
.badge { display: flex; gap: 14px; align-items: center; padding: 12px 16px; width: fit-content; min-width: 320px; }
.avatar { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--cond); font-weight: 800; font-size: 24px; color: #111; border: 2px solid rgba(255,255,255,.3); }
.b-name { font-weight: 700; }
.b-lvl { font-size: 11px; letter-spacing: .12em; color: var(--dim); font-weight: 600; }
.b-lvl .pts { color: var(--accent2); }
.xpbar { height: 6px; width: 220px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.xpbar.big { height: 10px; width: 100%; border-radius: 5px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #3ddc84, #b6ff6a); }
.main-menu { display: flex; flex-direction: column; gap: 8px; }
.menu-item { text-align: left; background: rgba(12,17,15,0.6); border: 1px solid var(--line); border-radius: 12px; padding: 13px 18px; display: flex; flex-direction: column; transition: all .18s; backdrop-filter: blur(8px); }
.menu-item b { font-family: var(--cond); font-weight: 800; font-size: 24px; letter-spacing: .05em; }
.menu-item span { font-size: 12px; color: var(--dim); }

.menu-item.hero { background: linear-gradient(135deg, rgba(61,220,132,0.35), rgba(61,220,132,0.08)); border-color: rgba(61,220,132,0.6); padding: 18px 20px; }

.menu-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }

.setup { padding: 22px 34px 60px; max-width: 1400px; margin: 0 auto; }
.setup-head { display: flex; align-items: center; gap: 20px; position: sticky; top: 0; z-index: 2; padding: 12px 0; background: linear-gradient(180deg, rgba(6,10,8,0.95), rgba(6,10,8,0.8)); }
.setup-title { font-family: var(--cond); font-weight: 800; font-size: 34px; letter-spacing: .03em; }

.steps { display: flex; gap: 6px; margin-left: auto; }
.step { padding: 6px 12px; border-radius: 20px; font-size: 12px; letter-spacing: .12em; font-weight: 700; color: var(--dim); border: 1px solid var(--line); }
.step.on { color: #06210f; background: var(--accent); border-color: var(--accent); }
.step.done { color: var(--accent); border-color: rgba(61,220,132,.4); }
.section-title { font-size: 11px; letter-spacing: .2em; color: var(--dim); font-weight: 700; margin: 22px 0 10px; }
.section-title small { letter-spacing: 0; font-weight: 500; }
.golfer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.golfer-card { background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; transition: all .15s; position: relative; }
.golfer-card:hover { border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }
.golfer-card.sel { border-color: var(--accent); background: rgba(61,220,132,0.1); box-shadow: 0 0 0 1px var(--accent), 0 10px 30px rgba(61,220,132,.2); }
.gc-avatar { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; float: left; margin-right: 12px; border: 1px solid rgba(255,255,255,.2); }
.gc-avatar span { font-family: var(--cond); font-weight: 800; font-size: 22px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.gc-name { font-weight: 700; font-size: 16px; }
.gc-sub { font-size: 12px; color: var(--dim); }
.gc-tag { position: absolute; top: 12px; right: 12px; font-size: 9px; letter-spacing: .14em; font-weight: 700; color: var(--accent2); border: 1px solid var(--accent2); padding: 2px 6px; border-radius: 10px; }
.attr-bars { clear: both; padding-top: 12px; display: grid; gap: 4px; }
.attr-bars div { display: grid; grid-template-columns: 34px 1fr 26px; align-items: center; gap: 6px; font-size: 10px; color: var(--dim); font-weight: 700; letter-spacing: .08em; }
.attr-bars i { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.attr-bars i b { display: block; height: 100%; background: linear-gradient(90deg, #2a7fff, #3ddc84); }
.attr-bars em { font-style: normal; color: var(--text); text-align: right; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
.course-card { border-radius: 16px; overflow: hidden; background: rgba(255,255,255,0.04); border: 1px solid var(--line); cursor: pointer; position: relative; transition: all .2s; }
.course-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.3); box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.course-card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 16px 40px rgba(61,220,132,.2); }
.cc-img { height: 170px; background: linear-gradient(135deg, var(--accent), #0d1a12); background-size: cover; background-position: center; position: relative; }
.cc-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(8,12,10,0.9)); }
.shimmer { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.12) 50%, transparent 80%); background-size: 200% 100%; animation: shim 1.3s infinite; }
@keyframes shim { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.cc-body { padding: 12px 16px 16px; margin-top: -40px; position: relative; }
.cc-name { font-family: var(--cond); font-weight: 800; font-size: 26px; letter-spacing: .03em; }
.cc-loc { font-size: 12px; color: #d7e2dc; }
.cc-meta { display: flex; gap: 10px; margin-top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
.cc-blurb { font-size: 12px; color: var(--dim); margin-top: 8px; line-height: 1.45; min-height: 34px; }
.cc-best { margin-top: 8px; font-size: 11px; font-weight: 700; color: var(--accent2); letter-spacing: .1em; }
.course-card.locked { cursor: not-allowed; }
.course-card.locked .cc-img, .course-card.locked .cc-body { filter: grayscale(1) brightness(.5); }
.lock { position: absolute; top: 70px; left: 0; right: 0; text-align: center; font-weight: 800; letter-spacing: .12em; font-size: 13px; }
.setup-course-banner { display: flex; gap: 16px; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 14px; padding: 10px; font-size: 13px; color: var(--dim); line-height: 1.6; }
.setup-course-banner b { color: var(--text); }
.scb-img { width: 200px; height: 100px; border-radius: 10px; background-size: cover; background-position: center; background-color: var(--accent); }
.opts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.opt { background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; text-align: left; min-width: 170px; transition: all .15s; }
.opt b { display: flex; align-items: center; gap: 8px; font-family: var(--cond); font-size: 20px; letter-spacing: .04em; }
.opt span { font-size: 12px; color: var(--dim); }
.opt:hover { border-color: rgba(255,255,255,0.3); }
.opt.on { border-color: var(--accent); background: rgba(61,220,132,0.12); }
.tee-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); display: inline-block; }
.hole-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; }
.hole-btn { background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; }
.hole-btn b { font-family: var(--cond); font-size: 24px; }
.hole-btn span { font-size: 10px; color: var(--dim); }
.hole-btn em { font-size: 9px; font-style: normal; color: var(--accent2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.hole-btn.sig { border-color: rgba(242,201,76,0.45); }
.hole-btn.on { border-color: var(--accent); background: rgba(61,220,132,0.14); }

.page { padding: 22px 34px 60px; max-width: 1400px; margin: 0 auto; }
.page.narrow { max-width: 820px; }
.page.cust { max-width: none; margin: 0; }
.page-head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.page-title { font-family: var(--cond); font-weight: 800; font-size: 40px; letter-spacing: .03em; }
.page-title small { display: block; font-family: var(--sans); font-size: 13px; color: var(--dim); font-weight: 500; letter-spacing: 0; }
.cols { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 16px; }
.cols.two { grid-template-columns: 1.2fr 1fr; }
.col { padding: 6px 18px 18px; }
.career-top { display: flex; align-items: center; gap: 24px; padding: 18px 24px; margin-bottom: 16px; }
.lvl-big { font-family: var(--cond); font-weight: 800; font-size: 64px; line-height: 1; color: var(--accent); text-align: center; }
.lvl-big small { display: block; font-size: 12px; letter-spacing: .2em; color: var(--dim); }
.lvl-info { flex: 1; font-size: 13px; color: var(--dim); display: grid; gap: 6px; }
.pts-left { color: var(--accent2); font-weight: 700; }
.skill { padding: 10px 0; border-bottom: 1px solid var(--line); }
.sk-head { display: flex; justify-content: space-between; font-family: var(--cond); font-size: 18px; }
.sk-head span { font-weight: 800; color: var(--accent); }
.sk-bar { height: 7px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin: 6px 0; }
.sk-bar i { display: block; height: 100%; background: linear-gradient(90deg, #2a7fff, #3ddc84); }
.sk-desc { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; }
.stat-grid.wide { grid-template-columns: repeat(4, 1fr); padding: 0 6px 12px; }
.stat-grid span { display: block; font-size: 10px; color: var(--dim); letter-spacing: .08em; }
.stat-grid b { font-family: var(--cond); font-size: 22px; }
.list { width: 100%; border-collapse: collapse; font-size: 13px; }
.list td { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.list tr.hdr td { font-size: 10px; letter-spacing: .12em; color: var(--dim); font-weight: 700; }
.unl { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.unl b { font-family: var(--cond); color: var(--accent2); width: 100%; }
.unl span { font-size: 11px; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 3px 8px; }
.cust-panel { width: min(560px, 94vw); margin: 0 0 0 34px; padding: 10px 20px 20px; max-height: calc(100vh - 110px); overflow-y: auto; }
.cust-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.cust-row label { font-size: 11px; letter-spacing: .12em; color: var(--dim); font-weight: 700; text-transform: uppercase; }
.cust-row input:not([type=range]) { background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: 15px; font-family: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 18px; padding: 6px 12px; font-size: 12px; transition: all .12s; }
.chip:hover { border-color: rgba(255,255,255,.3); }
.chip.on { background: rgba(61,220,132,0.18); border-color: var(--accent); color: #d6ffe7; }
.chip.locked { opacity: .4; }
.chip[disabled] { opacity: .8; cursor: default; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); }
.sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
.club-toggle { display: flex; flex-wrap: wrap; gap: 6px; }
.bag-count { margin-left: auto; font-family: var(--cond); font-size: 22px; color: var(--accent); }
.minibar { width: 90px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--accent); }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.set-row b { display: block; }
.set-row span { font-size: 12px; color: var(--dim); }
.toggle { width: 48px; height: 26px; border-radius: 13px; border: 1px solid var(--line); background: rgba(255,255,255,0.1); position: relative; transition: all .15s; flex-shrink: 0; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: all .15s; }
.toggle.on { background: var(--accent); }
.toggle.on i { left: 25px; }
input[type=range] { accent-color: var(--accent); width: 220px; }
.controls-help { margin-top: 16px; padding: 6px 18px 18px; }
.result-hero { display: flex; gap: 40px; align-items: center; padding: 20px 30px; margin-bottom: 16px; }
.rh-score, .rh-par { font-family: var(--cond); font-weight: 800; font-size: 80px; line-height: 1; text-align: center; }
.rh-score small, .rh-par small { display: block; font-size: 12px; letter-spacing: .2em; color: var(--dim); }
.rh-xp { flex: 1; font-family: var(--cond); font-size: 30px; }
.lvlup { color: var(--accent2); font-size: 22px; animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .6; } }
.sc-wrap { padding: 18px; margin-bottom: 16px; }
.center { text-align: center; margin-top: 20px; display: flex; gap: 12px; justify-content: center; }

@media (max-width: 1100px) {
  .hud-bottom-center { width: calc(100vw - 40px); min-width: 0; bottom: 12px; }
  .hud-bottom-left { bottom: auto; top: 110px; width: 210px; transform: scale(.9); transform-origin: top left; }
  .help { display: none; }
  .cols { grid-template-columns: 1fr; }
  .cols.two { grid-template-columns: 1fr; }
  .minimap canvas { width: 130px; height: 208px; }
  .hole-grid { grid-template-columns: repeat(6, 1fr); }
}
@media (max-width: 700px) {
  .hud-top-left { min-width: 0; transform: scale(.8); transform-origin: top left; }
  .hud-top-right { transform: scale(.8); transform-origin: top right; }
  .banner-main { font-size: 56px; }
  .toast-main { font-size: 30px; }
  .setup { padding: 12px; }
  .steps { display: none; }
  .logo-title { font-size: 48px; }
  .stat-grid.wide { grid-template-columns: repeat(2, 1fr); }
}
@media (max-height: 860px) {
  .main-layout { padding: 3vh 5vw; gap: 12px; }
  .menu-item { padding: 8px 16px; }
  .menu-item b { font-size: 20px; }
  .menu-item.hero { padding: 12px 18px; }
  .menu-item.hero b { font-size: 28px; }
  .menu-item.small b { font-size: 16px; }
  .logo-title { font-size: 50px; }
  .logo-mark { width: 56px; height: 56px; font-size: 34px; }
  .badge { padding: 8px 14px; }
}


/* ================= BOOT / ROTATE / OFFLINE ================= */
#boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 60%, #14301f, #060a08 70%); transition: opacity .6s; }
#boot.done { opacity: 0; pointer-events: none; }
.boot-logo { font-family: var(--cond); font-weight: 800; font-size: clamp(44px, 9vw, 84px); letter-spacing: .02em; }
.boot-logo span { color: var(--accent); }
.boot-sub { font-size: 11px; letter-spacing: .42em; color: var(--dim); font-weight: 600; margin-top: 2px; }
.boot-msg, .load-msg { margin-top: 14px; font-size: 13px; letter-spacing: .18em; color: #cfe; text-transform: uppercase; animation: pulse 1s infinite alternate; }
.putt-anim { position: relative; width: 190px; height: 34px; margin-top: 28px; border-bottom: 2px solid rgba(61,220,132,0.35); }
.putt-anim .ball { position: absolute; left: 0; bottom: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.7); animation: putt 2.2s cubic-bezier(.3,.6,.4,1) infinite; }
.putt-anim .cup { position: absolute; right: 18px; bottom: -3px; width: 18px; height: 6px; border-radius: 50%; background: #020402; }
.putt-anim .flag { position: absolute; right: 26px; bottom: 0; width: 2px; height: 34px; background: #eee; }
.putt-anim .flag::after { content: ''; position: absolute; left: 2px; top: 0; border-left: 16px solid #e53935; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
@keyframes putt { 0% { transform: translateX(0) rotate(0); opacity: 1; } 78% { transform: translateX(158px) rotate(540deg); opacity: 1; } 86% { transform: translateX(163px) translateY(9px) scale(.7); opacity: 0; } 100% { opacity: 0; } }
.load-card .putt-anim { margin: 24px auto 0; }

#rotate { display: none; position: fixed; inset: 0; z-index: 60; background: #070b09; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
#rotate .phone { width: 64px; height: 110px; border: 4px solid #eef3ef; border-radius: 14px; position: relative; animation: rot 2.4s ease-in-out infinite; }
#rotate .phone i { position: absolute; left: 50%; bottom: 6px; width: 14px; height: 4px; margin-left: -7px; border-radius: 2px; background: #eef3ef; }
#rotate .phone::before { content: ''; position: absolute; inset: 10px 6px 16px; border-radius: 4px; background: linear-gradient(160deg, #3ddc84, #147a42); }
@keyframes rot { 0%, 20% { transform: rotate(0); } 55%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
.rotate-title { margin-top: 34px; font-family: var(--cond); font-weight: 800; font-size: 30px; letter-spacing: .08em; }
.rotate-sub { margin-top: 6px; color: var(--dim); font-size: 15px; }
@media (orientation: portrait) and (max-width: 600px) { #rotate { display: flex; } }

#offline { position: fixed; top: calc(var(--st) + 8px); left: 50%; transform: translate(-50%, -150%); z-index: 45; background: rgba(120, 20, 16, 0.92); border: 1px solid rgba(255,120,110,.6); border-radius: 12px; padding: 8px 16px; display: flex; gap: 10px; align-items: baseline; transition: transform .35s; pointer-events: none; font-size: 13px; }
#offline b { font-family: var(--cond); letter-spacing: .1em; font-size: 15px; }
#offline.show { transform: translate(-50%, 0); }

/* ================= TOP BUTTONS (all devices) ================= */
.top-btns { position: absolute; top: calc(var(--st) + 18px); right: calc(var(--sr) + 18px); display: flex; gap: 6px; }
.tbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 17px; display: grid; place-items: center; }
.tbtn:active { background: rgba(61,220,132,0.3); }
body:not(.touch) .hud-top-right { top: 66px; }
.mbar, .m-swing { display: none; }

/* ================= TOUCH / MOBILE LANDSCAPE HUD ================= */
body.touch .help, body.touch .aim-pad, body.touch #swing-btn, body.touch .club-picker { display: none !important; }
body.touch .top-btns { top: calc(var(--st) + 8px); right: calc(var(--sr) + 10px); gap: 6px; }
body.touch .tbtn { width: 40px; height: 40px; }
body.touch .hud-top-left { top: calc(var(--st) + 8px); left: calc(var(--sl) + 10px); min-width: 0; padding: 5px 10px 5px 5px; gap: 8px; border-radius: 12px; }
body.touch .hc-num { font-size: 26px; min-width: 38px; border-radius: 8px; padding: 2px 6px; }
body.touch .hc-course { font-size: 8px; letter-spacing: .1em; }
body.touch .hc-title { font-size: 17px; line-height: 1.05; }
body.touch .hc-sub { font-size: 10px; }
body.touch .hc-score { padding-left: 8px; }
body.touch .hc-stroke { font-size: 9px; }
body.touch .hc-topar { font-size: 22px; line-height: 1; }
body.touch .hud-top-right { top: calc(var(--st) + 56px); right: calc(var(--sr) + 10px); gap: 6px; }
body.touch .wind { padding: 4px 8px; gap: 6px; border-radius: 10px; }
body.touch .wind-label { display: none; }
body.touch .wind-dial { width: 30px; height: 30px; }
body.touch .wind-arrow { font-size: 15px; }
body.touch .wind-mph { font-size: 17px; min-width: 0; }
body.touch .minimap { padding: 3px; border-radius: 10px; }
body.touch .minimap canvas { width: 88px; height: 141px; border-radius: 7px; }
body.touch #info { left: calc(var(--sl) + 10px); top: auto; bottom: calc(var(--sb) + 76px); width: auto; min-width: 150px; padding: 6px 10px; border-radius: 12px; transform: none; }
body.touch #info .info-row { padding: 1px 0; border: 0; gap: 6px; }
body.touch #info .info-row span { font-size: 8px; width: 58px; }
body.touch #info .info-row b { font-size: 15px; }
body.touch #info .info-row em { font-size: 10px; }
body.touch #info .info-row:nth-child(3), body.touch #info .info-row:nth-child(5), body.touch #info .club-card { display: none; }
body.touch .hud-bottom-center { left: 50%; bottom: calc(var(--sb) + 78px); width: min(46vw, 460px); min-width: 0; gap: 0; }
body.touch .meter { height: 20px; border-radius: 10px; }
body.touch .meter::before { border-radius: 0 10px 10px 0; }
body.touch .meter-fill { border-radius: 8px; }
body.touch .meter-ticks .tick span { top: 22px; font-size: 9px; }
body.touch .meter-target { top: -19px; font-size: 13px; }
body.touch .meter-target::after { height: 26px; top: 17px; }
body.touch .meter-marker { top: -6px; bottom: -6px; }
body.touch .shot-controls { display: none; position: absolute; bottom: calc(100% + 26px); left: 50%; transform: translateX(-50%); width: min(92vw, 640px); padding: 10px; max-height: calc(var(--app-h, 100vh) - 150px); overflow: auto; }
body.touch #shotbar.open .shot-controls { display: flex; }
body.touch .shot-controls.hidden { display: none !important; }
body.touch .seg button { padding: 10px 11px; font-size: 14px; }
