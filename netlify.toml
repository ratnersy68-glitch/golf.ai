# Netlify settings for the Golf.ai game (lives in /game).
# Netlify builds it automatically on every push.
[build]
  base = "game"
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

# Single-page game: any unknown path serves the game
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
