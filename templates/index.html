<!DOCTYPE html>
<html>
<body>

<h2>Golf AI</h2>

<input id="zip" placeholder="ZIP"><br><br>

<select id="tone">
  <option>friendly</option>
  <option>professional</option>
</select><br><br>

<textarea id="msg" placeholder="What do you want to say"></textarea><br><br>

<button onclick="gen()">Generate</button>

<div id="out"></div>

<script>
async function gen() {
  const res = await fetch("/generate", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      zip: document.getElementById("zip").value,
      message: document.getElementById("msg").value,
      tone: document.getElementById("tone").value
    })
  });

  const data = await res.json();
  const out = document.getElementById("out");
  out.innerHTML = "";

  data.forEach(d => {
    out.innerHTML += `
      <h3>${d.name}</h3>
      <textarea>${d.message}</textarea><br>
      <input placeholder="email"><br>
      <button onclick="send('${d.id}', this)">Send</button>
      <hr>
    `;
  });
}

async function send(id, btn) {
  const parent = btn.parentElement;
  const email = parent.querySelector("input").value;

  await fetch("/send", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ id, email })
  });

  alert("Sent");
}
</script>

</body>
</html>
